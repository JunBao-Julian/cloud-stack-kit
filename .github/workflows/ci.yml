name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check:public
      - run: python3 -W error::ResourceWarning -m unittest discover -s tests -p test_server.py -v
      - run: bash -n server/bootstrap.sh

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:public
      - name: Windows PowerShell 5.1 validation
        shell: powershell
        run: .\Validate-Kit.ps1
      - name: Build reviewed source package
        shell: powershell
        run: .\Build-Package.ps1 -Destination "$env:RUNNER_TEMP\cloud-stack-kit.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-stack-kit
          path: |
            ${{ runner.temp }}/cloud-stack-kit.zip
            ${{ runner.temp }}/cloud-stack-kit.zip.sha256
          if-no-files-found: error
